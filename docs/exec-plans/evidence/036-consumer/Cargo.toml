[package]
name = "group-stage24-consumer-evidence"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace]

[dependencies]
async-trait = "0.1.89"
futures-util = "0.3.31"
group-agent-core = { path = "../../../../crates/group-agent-core" }
group-agent-model = { path = "../../../../crates/group-agent-model" }
group-agent-prebuilt = { path = "../../../../crates/group-agent-prebuilt", features = ["agent-sequence"] }
group-agent-tool = { path = "../../../../crates/group-agent-tool" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread"] }
