[workspace]
members = ["crates/group-agent-core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.91"
criterion = { version = "0.7.0", default-features = false, features = [
    "async_tokio",
    "cargo_bench_support",
] }
futures-util = "0.3.31"
indexmap = "2.14.0"
petgraph = "0.8.3"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tracing = "0.1.44"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
