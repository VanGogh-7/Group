[workspace]
members = [
    "crates/group-agent-checkpoint-sqlite",
    "crates/group-agent-core",
    "crates/group-agent-genai",
    "crates/group-agent-mcp",
    "crates/group-agent-model",
    "crates/group-agent-observability-tokio",
    "crates/group-agent-tool",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-trait = "0.1.91"
criterion = { version = "0.7.0", default-features = false, features = [
    "async_tokio",
    "cargo_bench_support",
] }
futures-util = "0.3.31"
futures-core = "0.3.31"
futures-executor = "0.3.31"
genai = "=0.6.5"
indexmap = "2.14.0"
jsonschema = { version = "0.49.2", default-features = false }
petgraph = "0.8.3"
rmcp = { version = "=2.2.0", default-features = false, features = [
    "client",
    "transport-async-rw",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "=0.8.6", default-features = false, features = [
    "macros",
    "migrate",
    "runtime-tokio",
    "sqlite",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = { version = "0.7.17", features = ["rt"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tracing = "0.1.44"
uuid = { version = "1.24.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
